[project]
name = "cfa-agent"
version = "0.1.0"
description = "Teaching notebook: a tool-using agent that gives a buy/hold/sell recommendation"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "yfinance",
    "ddgs",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfa_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
